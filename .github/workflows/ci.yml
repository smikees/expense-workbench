name: Validate public starter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP extensions
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring
      - run: python scripts/check-public-tree.py
      - run: python tests/test_core.py
      - run: python tests/test_http.py --php php
      - run: node tests/reporting.cjs
      - name: Syntax checks
        run: find site -name '*.php' -exec php -l {} \;
